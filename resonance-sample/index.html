<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05060c">
    <title>Resonance · RG HQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #05060c;
        color: #e8ecf5;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        cursor: none;               /* no hand cursor — the pyreflies are the pointer */
        touch-action: none;         /* stirring never scrolls/zooms */
        overscroll-behavior: none;
      }
      /* the pics we already have — the real night backgrounds, cross-fading like the switcher.
         Nothing about the images is altered; the motion rides on top. */
      .bg-pic {
        position: fixed; inset: 0; z-index: 0;
        background-size: cover; background-position: center;
        opacity: 0; transition: opacity 2.5s ease;
      }
      .bg-pic.active { opacity: 1; }

      canvas.field { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

      .hint {
        position: fixed; left: 0; right: 0; bottom: 8%; z-index: 2; text-align: center;
        font-weight: 300; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(230,236,250,0.72); text-shadow: 0 1px 10px rgba(0,0,0,0.7);
        animation: hintFade 7s ease forwards;
      }
      @keyframes hintFade { 0%,55% { opacity: 1; } 100% { opacity: 0; } }

      .back {
        position: fixed; top: 16px; left: 18px; z-index: 3;
        font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
        color: rgba(230,236,250,0.85); text-decoration: none; cursor: none;
        text-shadow: 0 1px 10px rgba(0,0,0,0.8);
      }
      .back:hover { color: #fff; }
      @media (prefers-reduced-motion: reduce) { .hint { display: none; } }
    </style>
</head>
<body>
    <!-- real existing backgrounds (first is active by default so reduced-motion holds on it) -->
    <div class="bg-pic active" style="background-image:url('/assets/backgrounds/bg-night-1.png')"></div>
    <div class="bg-pic" style="background-image:url('/assets/backgrounds/bg-night-3.png')"></div>
    <div class="bg-pic" style="background-image:url('/assets/backgrounds/bg-night-4.png')"></div>

    <canvas class="field" data-pyreflies aria-hidden="true"></canvas>
    <p class="hint">move · touch · stir the field</p>
    <a class="back" href="/">← RG HQ</a>

    <script>
      // cross-fade the real backgrounds, like the home switcher. Motion rides on top.
      (function () {
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var pics = [].slice.call(document.querySelectorAll('.bg-pic'));
        if (pics.length < 2) return;
        var i = 0;
        setInterval(function () {
          pics[i].classList.remove('active');
          i = (i + 1) % pics.length;
          pics[i].classList.add('active');
        }, 9000);
      })();
    </script>
    <script src="/js/pyreflies.js"></script>
</body>
</html>
