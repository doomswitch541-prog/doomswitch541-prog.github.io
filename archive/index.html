<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="The collections kept at RG HQ.">
    <title>Archive — RG HQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;family=JetBrains+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/archive.css">
</head>
<body>
    <div class="bg-layer night" id="bg-night"></div>
    <div class="bg-layer evening" id="bg-evening"></div>
    <div class="bg-layer afternoon" id="bg-afternoon"></div>
    <div class="bg-layer day" id="bg-day"></div>

    <nav class="navbar" aria-label="RG HQ">
        <div class="nav-left">
            <a href="/" class="btn">RG</a>
        </div>
        <div class="nav-center"></div>
        <div class="nav-right">
            <button id="theme-switch" class="btn" type="button">Auto</button>
        </div>
    </nav>

    <main class="archive-category-page">
        <header class="archive-category-mast">
            <p class="archive-overline">RG HQ / ARCHIVE</p>
            <h1>Archive</h1>
            <p>Things kept long enough to find again.</p>
        </header>

        <nav class="archive-collections" aria-label="Archive collections">
            <a class="archive-collection-link" href="/archive/books">
                <span class="archive-collection-spine" aria-hidden="true"></span>
                <span class="archive-collection-copy">
                    <strong>Books</strong>
                    <span>One pull a day, with every previous book kept on the shelf.</span>
                </span>
                <span class="archive-collection-arrow" aria-hidden="true">↗</span>
            </a>
        </nav>
    </main>

    <script src="/js/site.js"></script>
</body>
</html>
