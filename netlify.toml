# Netlify config for RG HQ — static site, no build step.
# Lives inside the published folder so a Drop OR `netlify deploy --dir=rghq`
# both read it. Headers/redirects below apply to the live site only; the local
# serve.js preview does not emit them — use `netlify dev` to test these.

[build]
  publish = "."

# Serve /foo.html at /foo and 301 the .html form to the clean URL.
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = false

# Custom 404 for any unmatched path.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---- Security + caching headers ----------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    # CSP note: script-src keeps 'unsafe-inline' because the globe/slamviz/weather
    # pages carry large inline <script> blocks. Hardening step later: externalise
    # those scripts, then drop 'unsafe-inline' (nonce or hash). Everything else is
    # already locked to self + the few hosts we actually load from.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://*.open-meteo.com https://*.api.radio-browser.info https://public.radio.co https://somafm.com https://kathy.torontocast.com:2005 https://radio.streemlion.com:4405 https://c22.radioboss.fm:18364 https://scream.behindthesch3m3s.com https://podradio.us https://c23.radioboss.fm https://r.bgp.rodeo https://cors.eu.org https://api.live365.com; media-src https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Fingerprint-free assets change rarely — cache hard, backgrounds + vendored
# three.js shouldn't re-download every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS change more often — a week, revalidated.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
