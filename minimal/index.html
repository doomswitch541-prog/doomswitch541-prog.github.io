<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050506">
    <title>Minimal — RG HQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050506;
            --ink: #f2f2f4;
            --dim: #6a6a72;
            --faint: #303038;
            --accent: #5c86f5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* faint graph-paper grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
            z-index: 0;
        }
        .clock {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.6rem;
            padding: 2rem;
            width: 100%;
            max-width: 640px;
        }
        .time {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            font-feature-settings: "zero" 1;   /* slashed zero */
            font-size: clamp(3.6rem, 16vw, 7rem);
            line-height: 1;
            letter-spacing: -0.01em;
        }
        .time .unit { font-variant-numeric: tabular-nums; }
        .time .sep {
            color: var(--faint);
            font-size: 0.6em;
            transform: translateY(-0.04em);
        }
        .ampm {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.35em;
            color: var(--dim);
            padding-left: 0.35em;
        }
        /* seconds-of-minute progress hairline */
        .progress {
            width: min(60%, 340px);
            height: 1px;
            background: var(--faint);
            position: relative;
            overflow: hidden;
        }
        .progress .fill {
            position: absolute;
            inset: 0 auto 0 0;
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }
        .date {
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.24em;
            color: var(--dim);
            text-transform: uppercase;
        }
        /* minimal status glyph — signal bars + a live dot */
        .status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.4rem;
        }
        .bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
        .bars span {
            width: 3px;
            background: var(--faint);
            border-radius: 1px;
        }
        .bars span:nth-child(1) { height: 5px; }
        .bars span:nth-child(2) { height: 9px; }
        .bars span:nth-child(3) { height: 13px; }
        .bars span:nth-child(4) { height: 16px; background: var(--ink); }
        .dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
        /* tap anywhere returns home — no visible chrome to keep it pure */
        .home {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: block;
        }
    </style>
</head>
<body>
    <a href="/" class="home" aria-label="Back to HQ"></a>
    <div class="clock">
        <div class="time">
            <span class="unit" id="hh">00</span>
            <span class="sep">:</span>
            <span class="unit" id="mm">00</span>
            <span class="sep">:</span>
            <span class="unit" id="ss">00</span>
            <span class="ampm" id="ap">AM</span>
        </div>
        <div class="progress"><div class="fill" id="bar"></div></div>
        <div class="date" id="date">—</div>
        <div class="status">
            <div class="bars"><span></span><span></span><span></span><span></span></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const pad = (n) => String(n).padStart(2, '0');
        const DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
        const MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        function tick() {
            const d = new Date();
            document.getElementById('hh').textContent = pad(d.getHours() % 12 || 12);
            document.getElementById('mm').textContent = pad(d.getMinutes());
            document.getElementById('ss').textContent = pad(d.getSeconds());
            document.getElementById('ap').textContent = d.getHours() >= 12 ? 'PM' : 'AM';
            document.getElementById('date').textContent =
                `${DAYS[d.getDay()]} · ${MONS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
            const frac = (d.getSeconds() + d.getMilliseconds() / 1000) / 60;
            document.getElementById('bar').style.width = (frac * 100).toFixed(2) + '%';
        }
        tick();
        setInterval(tick, 100);
    </script>
</body>
</html>
