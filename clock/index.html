<!DOCTYPE html>
<html lang="en" data-mode="minimal">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050506">
    <title>Clock — RG HQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050506;
            --ink: #f2f2f4;
            --dim: #6a6a72;
            --faint: #303038;
            --accent: #5c86f5;
            --accent-glow: rgba(92, 134, 245, 0.6);
            --geometry-a: rgba(92, 134, 245, 0.1);
            --geometry-b: rgba(185, 199, 240, 0.045);
            --geometry-line: rgba(126, 155, 235, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.6s ease;
        }
        /* faint graph-paper grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 56px 56px;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.6s ease;
        }
        .clock {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.4rem;           /* roomier than before */
            padding: 3rem;
            width: 100%;
            max-width: 680px;
        }
        .time {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            font-feature-settings: "zero" 1;   /* slashed zero */
            font-size: clamp(3.6rem, 16vw, 7rem);
            line-height: 1;
            letter-spacing: -0.01em;
        }
        .time .unit { font-variant-numeric: tabular-nums; }
        .time .sep {
            color: var(--faint);
            font-size: 0.6em;
            transform: translateY(-0.04em);
        }
        .ampm {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.35em;
            color: var(--dim);
            padding-left: 0.35em;
        }
        /* seconds-of-minute progress hairline */
        .progress {
            width: min(64%, 360px);
            height: 1px;
            background: var(--faint);
            position: relative;
            overflow: hidden;
        }
        .progress .fill {
            position: absolute;
            inset: 0 auto 0 0;
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }
        .date {
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.24em;
            color: var(--dim);
            text-transform: uppercase;
        }
        /* signal glyph — bars fill up across the minute, like the hairline */
        .status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
            margin-top: 0.6rem;
        }
        .bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .bars span {
            width: 3px;
            height: 4px;
            background: var(--faint);
            border-radius: 1px;
            transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
        }
        .bars span.on { background: var(--ink); }
        .bars span:nth-child(1).on { height: 6px; }
        .bars span:nth-child(2).on { height: 11px; }
        .bars span:nth-child(3).on { height: 15px; }
        .bars span:nth-child(4).on { height: 20px; }
        /* the bar currently filling glows and breathes */
        .bars span.tip {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: barpulse 1.3s ease-in-out infinite;
        }
        @keyframes barpulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
        .dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

        /* ===================== MODES ===================== */
        /* fx layers — parked at opacity 0 until a mode switches them on */
        .fx { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s ease; }

        /* ---------- SHARED: slow geometry + direct pointer response ---------- */
        .fx-geometry {
            z-index: 0;
            overflow: hidden;
            opacity: 0.72;
            contain: strict;
        }
        .geometry-shape,
        .geometry-touch {
            position: absolute;
            display: block;
            aspect-ratio: 1;
            border: 1px solid var(--geometry-line);
            background:
                radial-gradient(circle at 38% 34%, var(--geometry-a), transparent 58%),
                linear-gradient(138deg, var(--geometry-b), transparent 68%);
            pointer-events: none;
        }
        .geometry-shape {
            will-change: transform;
        }
        .geometry-shape:nth-child(1) {
            top: -24vmax;
            left: -19vmax;
            width: clamp(24rem, 54vmax, 58rem);
            border-radius: 50%;
            animation: geometry-breathe-a 24s ease-in-out infinite;
        }
        .geometry-shape:nth-child(2) {
            right: -18vmax;
            bottom: -23vmax;
            width: clamp(22rem, 50vmax, 54rem);
            border-radius: 42% 58% 52% 48%;
            animation: geometry-breathe-b 29s ease-in-out infinite;
        }
        .geometry-shape:nth-child(3) {
            top: 50%;
            left: 50%;
            width: clamp(8rem, 19vmin, 13rem);
            border-radius: 18%;
            opacity: 0.48;
            animation: geometry-breathe-c 21s ease-in-out infinite;
        }
        .geometry-touch {
            z-index: 2;
            width: clamp(8rem, 30vmin, 16rem);
            border-radius: 46% 54% 48% 52%;
            opacity: 0;
            transform: translate3d(-50%, -50%, 0) scale(0.18) rotate(-8deg);
            will-change: transform, opacity;
        }
        html[data-mode="pulse"] {
            --geometry-a: rgba(88, 245, 183, 0.085);
            --geometry-b: rgba(77, 230, 255, 0.04);
            --geometry-line: rgba(128, 255, 213, 0.085);
        }
        html[data-mode="pulse"] .fx-geometry { opacity: 0.48; }

        @keyframes geometry-breathe-a {
            0%, 100% { transform: translate3d(0, 0, 0) scale(0.88) rotate(-7deg); }
            50% { transform: translate3d(4vw, 3vh, 0) scale(1.12) rotate(2deg); }
        }
        @keyframes geometry-breathe-b {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1.08) rotate(5deg); }
            50% { transform: translate3d(-4vw, -2vh, 0) scale(0.86) rotate(-4deg); }
        }
        @keyframes geometry-breathe-c {
            0%, 100% { transform: translate3d(-50%, -50%, 0) scale(0.78) rotate(39deg); }
            50% { transform: translate3d(-50%, -50%, 0) scale(1.18) rotate(51deg); }
        }

        /* ---------- LIFESTREAM: the Planet's returning current ---------- */
        .fx-lifestream { z-index: 0; width: 100%; height: 100%; }
        .fx-mako-bloom {
            z-index: 0;
            background: radial-gradient(ellipse at 50% 70%, rgba(58, 235, 173, 0.11), transparent 48%);
            filter: blur(12px);
        }
        html[data-mode="pulse"] {
            --accent: #58f5b7;
            --accent-glow: rgba(88, 245, 183, 0.68);
        }
        html[data-mode="pulse"] body { background: #020908; }
        html[data-mode="pulse"] body::before {
            opacity: 0.26;
            background-image:
                linear-gradient(rgba(88,245,183,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88,245,183,0.018) 1px, transparent 1px);
        }
        html[data-mode="pulse"] .fx-lifestream { opacity: 1; }
        html[data-mode="pulse"] .fx-mako-bloom {
            opacity: 0.62;
        }
        html[data-mode="pulse"] .time {
            color: #f1fff9;
            text-shadow: 0 0 14px rgba(88, 245, 183, 0.09);
        }
        html[data-mode="pulse"] .time .sep { color: rgba(128, 255, 213, 0.4); }
        html[data-mode="pulse"] .date { color: rgba(164, 244, 216, 0.54); }
        html[data-mode="pulse"] .progress .fill {
            box-shadow: 0 0 10px rgba(88, 245, 183, 0.55);
        }
        html[data-mode="pulse"] .bars span.on { background: rgba(220, 255, 242, 0.9); }

        /* ---------- NEON: broken sign + CRT ---------- */
        .fx-scan {
            z-index: 3;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px);
            animation: scan-drift 8s linear infinite;
        }
        .fx-bloom { z-index: 0; display: flex; align-items: center; justify-content: center; }
        .fx-bloom::before {
            content: '';
            width: 62vmin; height: 30vmin;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(56,232,255,0.22), transparent 72%);
            filter: blur(22px);
            animation: bloom-breathe 3.6s ease-in-out infinite;
        }
        html[data-mode="neon"] {
            --accent: #38e8ff;
            --accent-glow: rgba(56,232,255,0.7);
            --geometry-a: rgba(56, 232, 255, 0.09);
            --geometry-b: rgba(255, 45, 107, 0.05);
            --geometry-line: rgba(82, 224, 255, 0.1);
        }
        html[data-mode="neon"] body { background: #03050a; }
        html[data-mode="neon"] .fx-geometry { opacity: 0.42; }
        html[data-mode="neon"] .fx-scan,
        html[data-mode="neon"] .fx-bloom { opacity: 1; }
        html[data-mode="neon"] .clock { animation: neon-hue 16s ease-in-out infinite; }
        html[data-mode="neon"] .time {
            color: #eafcff;
            text-shadow:
                -3px 0 rgba(255, 45, 107, 0.5),
                 3px 0 rgba(56, 232, 255, 0.5),
                 0 0 8px rgba(56, 232, 255, 0.5),
                 0 0 26px rgba(56, 232, 255, 0.35);
            animation: neon-flicker 7s steps(1, end) infinite;
        }
        html[data-mode="neon"] .time .sep { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        html[data-mode="neon"] .date {
            color: rgba(56, 232, 255, 0.62);
            text-shadow: 0 0 10px rgba(56, 232, 255, 0.3);
            animation: neon-flicker 7s steps(1, end) infinite;
            animation-delay: 0.4s;
        }
        html[data-mode="neon"] .ampm { color: rgba(56, 232, 255, 0.5); }

        @keyframes scan-drift { from { background-position-y: 0; } to { background-position-y: 12px; } }
        @keyframes bloom-breathe { 0%, 100% { opacity: 0.7; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
        @keyframes neon-hue { 0%, 100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(-26deg); } }
        @keyframes neon-flicker {
            0%, 100% { opacity: 1; }
            91% { opacity: 1; } 92% { opacity: 0.4; } 93% { opacity: 1; }
            95% { opacity: 0.7; } 96% { opacity: 1; }
        }

        /* ===================== DOCK + MODE FAB ===================== */
        .dock {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.4rem calc(1rem + env(safe-area-inset-bottom));
            pointer-events: none;   /* let the clock breathe; children re-enable */
        }
        .dock > *, .dock .fab-wrap * { pointer-events: auto; }
        .dock-links { display: flex; align-items: center; gap: 1rem; }
        .dock-home {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--dim);
            text-decoration: none;
            padding: 0.6rem 0.3rem;
            transition: color 0.3s ease;
        }
        .dock-home:hover, .dock-home:focus-visible { color: var(--ink); outline: none; }

        .fab-wrap { position: relative; }
        .fab {
            width: 52px; height: 52px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(16px);
            color: var(--ink);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        .fab:hover { border-color: var(--accent); }
        body.fab-open .fab { border-color: var(--accent); box-shadow: 0 6px 24px rgba(0,0,0,0.5), 0 0 16px var(--accent-glow); }
        /* sliders glyph — echoes the signal bars */
        .fab-ico { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; width: 16px; }
        .fab-ico i {
            display: block; height: 2px; border-radius: 1px;
            background: var(--accent); box-shadow: 0 0 6px var(--accent);
            transition: width 0.3s ease;
        }
        .fab-ico i:nth-child(1) { width: 16px; }
        .fab-ico i:nth-child(2) { width: 9px; }
        .fab-ico i:nth-child(3) { width: 13px; }

        .fab-menu {
            position: absolute;
            right: 0;
            bottom: calc(100% + 12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        body.fab-open .fab-menu { opacity: 1; visibility: visible; }
        .fab-opt {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--dim);
            background: rgba(10, 10, 14, 0.72);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            transform: translateY(8px);
            opacity: 0;
            transition: color 0.25s ease, border-color 0.25s ease,
                        box-shadow 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
        }
        body.fab-open .fab-opt { transform: translateY(0); opacity: 1; }
        body.fab-open .fab-opt:nth-child(1) { transition-delay: 0.02s; }
        body.fab-open .fab-opt:nth-child(2) { transition-delay: 0.06s; }
        body.fab-open .fab-opt:nth-child(3) { transition-delay: 0.10s; }
        .fab-opt:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.3); }
        .fab-opt.active {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .fab-scrim {
            position: fixed;
            inset: 0;
            z-index: 55;
            background: transparent;
            opacity: 0;
            visibility: hidden;
            transition: visibility 0.25s ease;
        }
        body.fab-open .fab-scrim { opacity: 1; visibility: visible; }

        @media (prefers-reduced-motion: reduce) {
            .bars span.tip, .dot,
            .fx-scan, .fx-bloom::before, .fx-mako-bloom, .geometry-shape,
            html[data-mode="neon"] .clock,
            html[data-mode="neon"] .time,
            html[data-mode="neon"] .date { animation: none; }
        }
    </style>
</head>
<body>
    <!-- experimental mode fx — decorative and ignored by assistive technology -->
    <div class="fx fx-geometry" id="geometry" aria-hidden="true">
        <i class="geometry-shape"></i>
        <i class="geometry-shape"></i>
        <i class="geometry-shape"></i>
    </div>
    <div class="fx fx-bloom"></div>
    <div class="fx fx-mako-bloom"></div>
    <canvas class="fx fx-lifestream" id="lifestream" aria-hidden="true"></canvas>
    <div class="fx fx-scan"></div>

    <main class="clock">
        <div class="time">
            <span class="unit" id="hh">00</span>
            <span class="sep">:</span>
            <span class="unit" id="mm">00</span>
            <span class="sep">:</span>
            <span class="unit" id="ss">00</span>
            <span class="ampm" id="ap">AM</span>
        </div>
        <div class="progress"><div class="fill" id="bar"></div></div>
        <div class="date" id="date">—</div>
        <div class="status">
            <div class="bars"><span></span><span></span><span></span><span></span></div>
            <div class="dot"></div>
        </div>
    </main>

    <!-- Dock: home link on the left, mode FAB on the right -->
    <nav class="dock" aria-label="Clock controls">
        <div class="dock-links">
            <a class="dock-home" href="/" aria-label="Back to HQ">HQ</a>
            <a class="dock-home" href="/365">365</a>
        </div>
        <div class="fab-wrap">
            <div class="fab-menu" role="menu">
                <button class="fab-opt" data-mode="neon" role="menuitemradio">Neon</button>
                <button class="fab-opt" data-mode="pulse" role="menuitemradio">Lifestream</button>
                <button class="fab-opt" data-mode="minimal" role="menuitemradio">Minimal</button>
            </div>
            <button class="fab" aria-label="Change mode" aria-expanded="false">
                <span class="fab-ico"><i></i><i></i><i></i></span>
            </button>
        </div>
    </nav>
    <div class="fab-scrim"></div>

    <script>
        const pad = (n) => String(n).padStart(2, '0');
        const DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
        const MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        const hh = document.getElementById('hh'), mm = document.getElementById('mm'),
              ss = document.getElementById('ss'), ap = document.getElementById('ap'),
              dateEl = document.getElementById('date'), bar = document.getElementById('bar');
        const bars = [...document.querySelectorAll('.bars span')];

        // ===== experimental fx: the Lifestream's returning current =====
        const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const geometry = document.getElementById('geometry');
        const lifeCanvas = document.getElementById('lifestream');
        const lifeCtx = lifeCanvas.getContext('2d');
        let lifeWidth = 0, lifeHeight = 0, lifeDpr = 1, lifeFrame = 0;
        let lifeMotes = [];

        function touchGeometry(event) {
            if (REDUCE || event.target.closest('a, button')) return;

            const activeTouches = geometry.querySelectorAll('.geometry-touch');
            if (activeTouches.length >= 5) activeTouches[0].remove();

            const touch = document.createElement('i');
            touch.className = 'geometry-touch';
            touch.setAttribute('aria-hidden', 'true');
            touch.style.left = `${event.clientX}px`;
            touch.style.top = `${event.clientY}px`;
            geometry.append(touch);

            const duration = event.pointerType === 'touch' ? 1900 : 2300;
            const motion = touch.animate([
                {
                    opacity: 0,
                    transform: 'translate3d(-50%, -50%, 0) scale(0.18) rotate(-8deg)',
                },
                {
                    opacity: 0.52,
                    transform: 'translate3d(-50%, -50%, 0) scale(0.58) rotate(-2deg)',
                    offset: 0.24,
                },
                {
                    opacity: 0,
                    transform: 'translate3d(-50%, -50%, 0) scale(1.28) rotate(8deg)',
                },
            ], {
                duration,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            });
            motion.onfinish = () => touch.remove();
        }

        window.addEventListener('pointerdown', touchGeometry, { passive: true });

        const newMote = (initial = false) => ({
            x: Math.random() * lifeWidth,
            y: initial ? Math.random() * lifeHeight : lifeHeight + Math.random() * 80,
            size: 0.45 + Math.random() * 1.2,
            speed: 0.1 + Math.random() * 0.28,
            drift: 0.18 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.18 + Math.random() * 0.4,
            memory: Math.random() > 0.84,
        });

        function resizeLifestream() {
            lifeWidth = window.innerWidth;
            lifeHeight = window.innerHeight;
            lifeDpr = Math.min(window.devicePixelRatio || 1, 2);
            lifeCanvas.width = Math.round(lifeWidth * lifeDpr);
            lifeCanvas.height = Math.round(lifeHeight * lifeDpr);
            lifeCanvas.style.width = lifeWidth + 'px';
            lifeCanvas.style.height = lifeHeight + 'px';
            lifeCtx.setTransform(lifeDpr, 0, 0, lifeDpr, 0, 0);
            const count = Math.min(72, Math.max(32, Math.floor(lifeWidth * lifeHeight / 18000)));
            lifeMotes = Array.from({ length: count }, () => newMote(true));
            if (REDUCE && document.documentElement.getAttribute('data-mode') === 'pulse') {
                drawLifestream(0, true);
            }
        }

        function drawCurrent(time, index, still) {
            const bands = 4;
            const baseY = lifeHeight * (0.28 + (index / (bands - 1)) * 0.48);
            const amplitude = 14 + index * 4;
            const phase = index * 1.37 + (still ? 0 : time * (0.000055 + index * 0.000006));
            const gradient = lifeCtx.createLinearGradient(0, baseY, lifeWidth, baseY);
            gradient.addColorStop(0, 'rgba(35, 210, 151, 0)');
            gradient.addColorStop(0.22, 'rgba(66, 238, 176, 0.05)');
            gradient.addColorStop(0.52, 'rgba(177, 255, 229, 0.13)');
            gradient.addColorStop(0.8, 'rgba(77, 230, 255, 0.06)');
            gradient.addColorStop(1, 'rgba(77, 230, 255, 0)');

            lifeCtx.beginPath();
            for (let x = -30; x <= lifeWidth + 30; x += 14) {
                const current = Math.sin(x * 0.006 + phase) * amplitude;
                const memory = Math.sin(x * 0.013 - phase * 1.6) * 4;
                const y = baseY + current + memory;
                if (x === -30) lifeCtx.moveTo(x, y);
                else lifeCtx.lineTo(x, y);
            }
            lifeCtx.lineWidth = 0.5 + (index % 2) * 0.2;
            lifeCtx.strokeStyle = gradient;
            lifeCtx.shadowBlur = 5;
            lifeCtx.shadowColor = index % 2 ? '#54f4bc' : '#85efff';
            lifeCtx.stroke();
        }

        function drawLifestream(time, still = false) {
            const active = document.documentElement.getAttribute('data-mode') === 'pulse';
            lifeCtx.clearRect(0, 0, lifeWidth, lifeHeight);
            if (!active) {
                lifeFrame = 0;
                return;
            }

            lifeCtx.save();
            lifeCtx.globalCompositeOperation = 'lighter';

            for (let i = 0; i < 4; i++) drawCurrent(time, i, still);

            for (const mote of lifeMotes) {
                if (!still) {
                    mote.y -= mote.speed;
                    mote.x += Math.sin(time * 0.00065 + mote.phase + mote.y * 0.008) * mote.drift;
                    if (mote.y < -22 || mote.x < -30 || mote.x > lifeWidth + 30) Object.assign(mote, newMote());
                }
                const breathe = still ? 0.75 : 0.55 + Math.sin(time * 0.002 + mote.phase) * 0.35;
                const alpha = mote.alpha * Math.max(0.18, breathe) * 0.68;
                lifeCtx.beginPath();
                lifeCtx.arc(mote.x, mote.y, mote.size * (mote.memory ? 1.3 : 1), 0, Math.PI * 2);
                lifeCtx.fillStyle = mote.memory ? `rgba(213,255,243,${alpha})` : `rgba(91,244,187,${alpha})`;
                lifeCtx.shadowBlur = mote.memory ? 9 : 4;
                lifeCtx.shadowColor = mote.memory ? '#d8fff5' : '#58f5b7';
                lifeCtx.fill();
            }

            lifeCtx.restore();
            if (!REDUCE && !still) lifeFrame = requestAnimationFrame(drawLifestream);
        }

        function startLifestream() {
            if (REDUCE) drawLifestream(0, true);
            else if (!lifeFrame) lifeFrame = requestAnimationFrame(drawLifestream);
        }

        function stopLifestream() {
            if (lifeFrame) cancelAnimationFrame(lifeFrame);
            lifeFrame = 0;
            lifeCtx.clearRect(0, 0, lifeWidth, lifeHeight);
        }

        window.addEventListener('resize', resizeLifestream, { passive: true });
        resizeLifestream();

        function tick() {
            const d = new Date();
            hh.textContent = pad(d.getHours() % 12 || 12);
            mm.textContent = pad(d.getMinutes());
            ss.textContent = pad(d.getSeconds());
            ap.textContent = d.getHours() >= 12 ? 'PM' : 'AM';
            dateEl.textContent = `${DAYS[d.getDay()]} · ${MONS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

            // seconds-of-minute fraction drives both the hairline and the bars
            const frac = (d.getSeconds() + d.getMilliseconds() / 1000) / 60;
            bar.style.width = (frac * 100).toFixed(2) + '%';

            // bars fill up across the minute, resetting each minute
            const active = Math.min(bars.length - 1, Math.floor(frac * bars.length));
            bars.forEach((b, i) => {
                b.classList.toggle('on', i <= active);
                b.classList.toggle('tip', i === active);
            });
        }
        tick();
        setInterval(tick, 100);

        // ===== Modes =====
        const root = document.documentElement;
        const opts = [...document.querySelectorAll('.fab-opt')];
        function setMode(m) {
            root.setAttribute('data-mode', m);
            localStorage.setItem('rg-clock-mode', m);
            opts.forEach(o => o.classList.toggle('active', o.dataset.mode === m));
            if (m === 'pulse') startLifestream();
            else stopLifestream();
        }
        // ?mode=neon|pulse|minimal wins (shareable), else last choice, else minimal
        const wanted = new URLSearchParams(location.search).get('mode');
        const known = ['minimal', 'pulse', 'neon'];
        setMode(known.includes(wanted) ? wanted : (localStorage.getItem('rg-clock-mode') || 'minimal'));

        // ===== FAB open/close (iOS-safe: button + scrim, no document click race) =====
        const fab = document.querySelector('.fab');
        const scrim = document.querySelector('.fab-scrim');
        const openFab = () => { document.body.classList.add('fab-open'); fab.setAttribute('aria-expanded', 'true'); };
        const closeFab = () => { document.body.classList.remove('fab-open'); fab.setAttribute('aria-expanded', 'false'); };
        fab.addEventListener('click', () =>
            document.body.classList.contains('fab-open') ? closeFab() : openFab());
        scrim.addEventListener('click', closeFab);
        opts.forEach(o => o.addEventListener('click', () => { setMode(o.dataset.mode); closeFab(); }));
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFab(); });
    </script>
</body>
</html>
