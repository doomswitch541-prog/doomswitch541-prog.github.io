<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Resonance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            background: #0a0e1a;
            color: #fff;
            cursor: crosshair;
        }

        /* Main background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/resonance-red.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.4) saturate(1.3);
            z-index: -3;
        }

        /* Animated gradient overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(16, 185, 186, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 60%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, rgba(10, 14, 26, 0.6) 0%, rgba(10, 14, 26, 0.9) 100%);
            z-index: -2;
            animation: overlayShift 15s ease-in-out infinite;
        }

        @keyframes overlayShift {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Floating image collage */
        .image-collage {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .floating-img {
            position: absolute;
            border-radius: 15px;
            border: 2px solid rgba(16, 185, 186, 0.3);
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(16, 185, 186, 0.2);
            transition: all 0.5s ease;
            animation: float 8s ease-in-out infinite;
            opacity: 0.7;
        }

        .floating-img:hover {
            opacity: 1;
            transform: scale(1.05) !important;
            border-color: rgba(16, 185, 186, 0.8);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 50px rgba(16, 185, 186, 0.6);
            z-index: 10 !important;
            pointer-events: auto;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(-10px) rotate(-1deg); }
        }

        /* Position floating images */
        .img-1 {
            top: 5%;
            left: 5%;
            width: 280px;
            height: 280px;
            object-fit: cover;
            animation-delay: 0s;
        }

        .img-2 {
            top: 15%;
            right: 8%;
            width: 220px;
            height: 220px;
            object-fit: cover;
            animation-delay: 2s;
        }

        .img-3 {
            bottom: 20%;
            left: 8%;
            width: 200px;
            height: 300px;
            object-fit: cover;
            animation-delay: 4s;
        }

        .img-4 {
            bottom: 15%;
            right: 10%;
            width: 240px;
            height: 240px;
            object-fit: cover;
            animation-delay: 1s;
        }

        /* Main content container */
        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
        }

        /* Scattered text elements */
        .text-scatter {
            position: absolute;
            color: #10b9ba;
            text-shadow: 0 0 20px rgba(16, 185, 186, 0.8);
            font-weight: bold;
            letter-spacing: 0.2em;
            opacity: 0.6;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .text-scatter:hover {
            opacity: 1;
            transform: scale(1.2);
            text-shadow: 0 0 40px rgba(16, 185, 186, 1);
        }

        .text-1 {
            top: 12%;
            left: 30%;
            font-size: clamp(1rem, 2vw, 1.5rem);
            transform: rotate(-5deg);
        }

        .text-2 {
            top: 35%;
            right: 15%;
            font-size: clamp(0.9rem, 1.8vw, 1.3rem);
            transform: rotate(8deg);
        }

        .text-3 {
            bottom: 25%;
            left: 15%;
            font-size: clamp(1rem, 2vw, 1.5rem);
            transform: rotate(-3deg);
        }

        .text-4 {
            top: 60%;
            left: 45%;
            font-size: clamp(0.8rem, 1.5vw, 1.2rem);
            transform: rotate(5deg);
        }

        /* Central title */
        .main-title {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: bold;
            letter-spacing: 0.15em;
            color: transparent;
            -webkit-text-stroke: 2px #10b9ba;
            text-shadow:
                0 0 30px rgba(16, 185, 186, 0.8),
                0 0 60px rgba(16, 185, 186, 0.4);
            animation: titlePulse 4s ease-in-out infinite;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 3;
        }

        @keyframes titlePulse {
            0%, 100% {
                -webkit-text-stroke: 2px #10b9ba;
                text-shadow:
                    0 0 30px rgba(16, 185, 186, 0.8),
                    0 0 60px rgba(16, 185, 186, 0.4);
            }
            50% {
                -webkit-text-stroke: 3px #10b9ba;
                text-shadow:
                    0 0 50px rgba(16, 185, 186, 1),
                    0 0 100px rgba(16, 185, 186, 0.6);
            }
        }

        /* Subtitle with glitch effect */
        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: rgba(16, 185, 186, 0.9);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            position: relative;
            z-index: 3;
            animation: glitch 5s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
                opacity: 1;
            }
            92% {
                transform: translate(-2px, 2px);
                opacity: 0.8;
            }
            94% {
                transform: translate(2px, -2px);
                opacity: 0.9;
            }
            96% {
                transform: translate(-1px, 1px);
                opacity: 0.85;
            }
        }

        /* Scattered particles */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #10b9ba;
            border-radius: 50%;
            box-shadow: 0 0 15px #10b9ba;
            animation: particleFloat 6s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-30px) scale(1.5);
                opacity: 1;
            }
        }

        /* Diagonal lines */
        .line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #10b9ba, transparent);
            opacity: 0.3;
            animation: lineGlow 3s ease-in-out infinite;
        }

        @keyframes lineGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .line-1 {
            top: 20%;
            left: 0;
            width: 40%;
            transform: rotate(-15deg);
            animation-delay: 0s;
        }

        .line-2 {
            top: 60%;
            right: 0;
            width: 50%;
            transform: rotate(20deg);
            animation-delay: 1s;
        }

        .line-3 {
            bottom: 30%;
            left: 10%;
            width: 45%;
            transform: rotate(-10deg);
            animation-delay: 2s;
        }

        /* Pagination */
        .pagination {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            align-items: center;
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 2px solid rgba(16, 185, 186, 0.4);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .pagination-btn {
            background: transparent;
            border: 2px solid #10b9ba;
            color: #10b9ba;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #10b9ba;
            color: #0a0e1a;
            box-shadow: 0 0 30px rgba(16, 185, 186, 0.8);
            transform: scale(1.15);
        }

        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination-home {
            color: #10b9ba;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .pagination-home:hover {
            text-shadow: 0 0 30px rgba(16, 185, 186, 1);
            transform: scale(1.2);
        }

        .page-indicator {
            color: rgba(16, 185, 186, 0.9);
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .floating-img {
                width: 150px !important;
                height: 150px !important;
            }

            .img-3 {
                height: 200px !important;
            }

            .text-scatter {
                font-size: 0.8rem !important;
            }

            .pagination {
                padding: 0.75rem 1.5rem;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Floating image collage -->
    <div class="image-collage">
        <img src="../assets/1764808070295_nasaproj-asset-rgt0.jpg" alt="Telescope" class="floating-img img-1">
        <img src="../assets/1768180794965_IMG_9862.jpeg" alt="Cosmic clouds" class="floating-img img-2">
        <img src="../assets/1768180794915_IMG_9901.jpeg" alt="Raccoon" class="floating-img img-3">
        <img src="../assets/resonance-red.jpeg" alt="City night" class="floating-img img-4">
    </div>

    <!-- Diagonal lines -->
    <div class="line line-1"></div>
    <div class="line line-2"></div>
    <div class="line line-3"></div>

    <!-- Particles container -->
    <div class="particles" id="particles"></div>

    <!-- Scattered text -->
    <div class="text-scatter text-1">FREQUENCIES</div>
    <div class="text-scatter text-2">NOCTURNAL</div>
    <div class="text-scatter text-3">PULSE</div>
    <div class="text-scatter text-4">ECHO</div>

    <!-- Main content -->
    <div class="content">
        <h1 class="main-title">RESONANCE</h1>
        <p class="subtitle">urban frequencies</p>
    </div>

    <!-- Pagination -->
    <div class="pagination">
        <button class="pagination-btn" id="prevBtn" onclick="navigate('prev')">◀</button>
        <span class="page-indicator" id="pageIndicator">Day 3/365</span>
        <button class="pagination-btn" id="nextBtn" onclick="navigate('next')">▶</button>
        <a href="/365/" class="pagination-home" title="View All Days">⊞</a>
    </div>

    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 6 + 's';
            particle.style.animationDuration = (4 + Math.random() * 4) + 's';
            particlesContainer.appendChild(particle);
        }

        // Mouse parallax effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;

            document.querySelectorAll('.floating-img').forEach((img, index) => {
                const speed = (index + 1) * 0.5;
                img.style.transform = `translate(${moveX * speed}px, ${moveY * speed}px)`;
            });

            document.querySelectorAll('.text-scatter').forEach((text, index) => {
                const speed = (index + 1) * 0.3;
                text.style.transform += ` translate(${moveX * speed}px, ${moveY * speed}px)`;
            });
        });

        // 365 Days of Pages collection
        const daysOfPages = [
            { day: 1, name: 'Paradise Motel', file: 'motel.html' },
            { day: 2, name: 'Luxury Tier Homelessness', file: 'luxurytierhomeless.html' },
            { day: 3, name: 'Urban Resonance', file: 'resonance.html' },
            { day: 4, name: 'Raccoon Gang', file: 'raccoongang.html' },
            { day: 5, name: 'RE-IND Homeland', file: 'day5.html' },
            { day: 6, name: 'Celestial Drift', file: 'day6.html' },
            { day: 7, name: 'Raccoons of Chongqing', file: 'day7.html' },
            { day: 8, name: 'SolarFlare', file: 'solarflare-about.html' },
            { day: 9, name: 'NERV Terminal', file: 'day9.html' },
            { day: 10, name: 'NERV System Monitor', file: 'day10.html' }
        ];

        const currentPageFile = window.location.pathname.split('/').pop();
        const currentIndex = daysOfPages.findIndex(page => page.file === currentPageFile);

        if (currentIndex !== -1) {
            document.getElementById('pageIndicator').textContent =
                `Day ${daysOfPages[currentIndex].day}/365`;
        }

        function navigate(direction) {
            let newIndex;

            if (direction === 'prev') {
                newIndex = currentIndex - 1;
            } else if (direction === 'next') {
                newIndex = currentIndex + 1;
            }

            if (newIndex >= 0 && newIndex < daysOfPages.length) {
                window.location.href = `/365/${daysOfPages[newIndex].file}`;
            }
        }

        // Disable navigation buttons at boundaries
        if (currentIndex !== -1) {
            if (currentIndex === 0) {
                document.getElementById('prevBtn').disabled = true;
            }
            if (currentIndex === daysOfPages.length - 1) {
                document.getElementById('nextBtn').disabled = true;
            }
        }
    </script>
</body>
</html>
