<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090d24">
    <title>Knowledgebase — 365 Days of Pages</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            color-scheme: dark;
            --ink: #f6f4ff;
            --muted: rgba(246, 244, 255, 0.58);
            --violet: #a78bfa;
            --cyan: #00fff9;
            --line: rgba(167, 139, 250, 0.28);
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--ink);
            font-family: "Courier New", monospace;
            background:
                radial-gradient(circle at 18% 18%, rgba(167, 139, 250, 0.14), transparent 34rem),
                radial-gradient(circle at 82% 78%, rgba(0, 255, 249, 0.08), transparent 30rem),
                linear-gradient(145deg, #090d24, #111631 54%, #080b1d);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.2;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 82%);
        }

        .back {
            position: fixed;
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            z-index: 2;
            border: 1px solid rgba(0, 255, 249, 0.32);
            border-radius: 50%;
            color: var(--cyan);
            background: rgba(9, 13, 36, 0.72);
            text-decoration: none;
            backdrop-filter: blur(12px);
        }

        .back:hover,
        .back:focus-visible {
            border-color: var(--cyan);
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 249, 0.18);
        }

        main {
            width: min(100%, 780px);
            padding: clamp(1.5rem, 5vw, 4rem);
            position: relative;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(8, 11, 30, 0.58);
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(16px);
        }

        main::after {
            content: "";
            position: absolute;
            right: clamp(1.5rem, 5vw, 4rem);
            top: 0;
            width: clamp(4rem, 15vw, 8rem);
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan));
            box-shadow: 0 0 14px rgba(0, 255, 249, 0.55);
        }

        .eyebrow {
            margin-bottom: clamp(2.5rem, 8vw, 5.5rem);
            color: var(--cyan);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 10ch;
            font-size: clamp(2.65rem, 11vw, 6.4rem);
            line-height: 0.9;
            letter-spacing: -0.07em;
            overflow-wrap: anywhere;
            background: linear-gradient(120deg, var(--ink), var(--violet) 60%, var(--cyan));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .purpose {
            max-width: 42rem;
            margin-top: 1.5rem;
            color: var(--muted);
            font-size: clamp(0.9rem, 2vw, 1.05rem);
            line-height: 1.75;
        }

        .topics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin-top: clamp(2.5rem, 7vw, 5rem);
            border-top: 1px solid var(--line);
        }

        .topic {
            padding: 1.1rem 0.7rem 0 0;
            color: rgba(246, 244, 255, 0.74);
            font-size: clamp(0.66rem, 1.8vw, 0.78rem);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .topic::before {
            content: "0" counter(topic);
            display: block;
            margin-bottom: 0.55rem;
            color: rgba(167, 139, 250, 0.65);
            font-size: 0.58rem;
        }

        .topics { counter-reset: topic; }
        .topic { counter-increment: topic; }

        @media (max-width: 480px) {
            main {
                margin-top: 3.5rem;
                border-radius: 17px;
            }

            .eyebrow {
                margin-bottom: 3rem;
            }

            .topics {
                grid-template-columns: 1fr;
            }

            .topic {
                padding: 0.85rem 0;
                border-bottom: 1px solid rgba(167, 139, 250, 0.12);
            }

            .topic::before {
                display: inline;
                margin-right: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <a class="back" href="/365/" aria-label="Back to 365 Days of Pages">←</a>
    <main>
        <p class="eyebrow">Day 15 · January 16, 2026</p>
        <h1>Knowledgebase</h1>
        <p class="purpose">A learning project about how information can be represented, retrieved, and classified.</p>
        <div class="topics" aria-label="Areas of study">
            <div class="topic">Embeddings</div>
            <div class="topic">Retrieval</div>
            <div class="topic">Classifiers</div>
        </div>
    </main>
</body>
</html>
