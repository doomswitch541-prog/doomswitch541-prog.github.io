<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradise Motel</title>
    <link rel="stylesheet" href="/365/archive-nav.css">
    <script src="/365/archive-nav.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            background: #0a0e27;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/motelu.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.7);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg,
                rgba(10, 14, 39, 0.3) 0%,
                rgba(10, 14, 39, 0.5) 50%,
                rgba(10, 14, 39, 0.7) 100%
            );
            z-index: -1;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        .neon-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: bold;
            text-align: center;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            animation: flicker 3s infinite alternate;
            text-shadow:
                0 0 10px #ff2a6d,
                0 0 20px #ff2a6d,
                0 0 30px #ff2a6d,
                0 0 40px #ff2a6d,
                0 0 70px #ff2a6d,
                0 0 80px #ff2a6d,
                0 0 100px #ff2a6d,
                0 0 150px #ff2a6d;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 2rem);
            color: #00fff9;
            text-align: center;
            margin-top: 1rem;
            letter-spacing: 0.3em;
            text-shadow:
                0 0 10px #00fff9,
                0 0 20px #00fff9,
                0 0 30px #00fff9,
                0 0 40px #00fff9;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .glass-card {
            margin-top: 4rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 3rem;
            max-width: 600px;
            box-shadow:
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                inset 0 0 20px rgba(0, 255, 249, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .glass-card p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .cta-button {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: 2px solid #ff2a6d;
            color: #ff2a6d;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin: 0 0.5rem;
        }

        .cta-button:hover {
            background: #ff2a6d;
            color: #fff;
            box-shadow:
                0 0 20px #ff2a6d,
                0 0 40px #ff2a6d,
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .cta-button.cyan {
            border-color: #00fff9;
            color: #00fff9;
        }

        .cta-button.cyan:hover {
            background: #00fff9;
            color: #0a0e27;
            box-shadow:
                0 0 20px #00fff9,
                0 0 40px #00fff9;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
            opacity: 0.3;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 5;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow:
                    0 0 10px #ff2a6d,
                    0 0 20px #ff2a6d,
                    0 0 30px #ff2a6d,
                    0 0 40px #ff2a6d,
                    0 0 70px #ff2a6d,
                    0 0 80px #ff2a6d,
                    0 0 100px #ff2a6d,
                    0 0 150px #ff2a6d;
            }
            20%, 24%, 55% {
                text-shadow:
                    0 0 5px #ff2a6d,
                    0 0 10px #ff2a6d,
                    0 0 15px #ff2a6d;
            }
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 10px #00fff9,
                    0 0 20px #00fff9,
                    0 0 30px #00fff9,
                    0 0 40px #00fff9;
            }
            to {
                text-shadow:
                    0 0 15px #00fff9,
                    0 0 30px #00fff9,
                    0 0 45px #00fff9,
                    0 0 60px #00fff9;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .pagination {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 249, 0.3);
            box-shadow: 0 4px 20px rgba(0, 255, 249, 0.2);
            z-index: 100;
        }

        .pagination-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #00fff9;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .pagination-btn:hover {
            background: rgba(0, 255, 249, 0.2);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 249, 0.5);
        }

        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-indicator {
            color: #00fff9;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(0, 255, 249, 0.5);
            min-width: 60px;
            text-align: center;
        }

        .pagination-home {
            width: 32px;
            height: 32px;
            background: transparent;
            border: 1px solid rgba(255, 42, 109, 0.5);
            color: #ff2a6d;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .pagination-home:hover {
            background: rgba(255, 42, 109, 0.2);
            border-color: #ff2a6d;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 1.5rem;
                margin-top: 2rem;
            }

            .glass-card p {
                font-size: 1rem;
            }

            .button-group {
                flex-direction: column;
            }

            .cta-button {
                width: 100%;
            }

            .pagination {
                bottom: 1rem;
                right: 1rem;
                padding: 0.6rem 1rem;
                gap: 0.8rem;
            }

            .pagination-btn {
                width: 28px;
                height: 28px;
                font-size: 1rem;
            }

            .page-indicator {
                font-size: 0.75rem;
                min-width: 50px;
            }

            .pagination-home {
                width: 28px;
                height: 28px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Pagination Navigation -->
    <div class="pagination" data-archive-day="1">
        <button class="pagination-btn" id="prevBtn" onclick="navigate('prev')">◀</button>
        <span class="page-indicator" id="pageIndicator">Day 1/365</span>
        <button class="pagination-btn" id="nextBtn" onclick="navigate('next')">▶</button>
        <a href="/365/" class="pagination-home" title="View All Days">⊞</a>
    </div>

    <div class="container">
        <h1 class="neon-text">Paradise</h1>
        <div class="subtitle">Motel</div>

        <div class="glass-card">
            <p>Lost in the neon glow of midnight streets, where dreams fade into electric haze and memories reflect in wet pavement.</p>

            <p>A sanctuary for night wanderers, digital nomads, and those who find beauty in the liminal spaces between dusk and dawn.</p>

            <div class="button-group">
                <a href="/" class="cta-button">Enter Paradise</a>
                <a href="/gallery.html" class="cta-button cyan">Explore More</a>
            </div>
        </div>
    </div>

    <script>
        // 365 Days of Pages collection
        const daysOfPages = [
            { day: 1, name: 'Paradise Motel', file: 'motel.html' },
            { day: 2, name: 'Luxury Tier Homelessness', file: 'luxurytierhomeless.html' },
            { day: 3, name: 'Urban Resonance', file: 'resonance.html' },
            { day: 4, name: 'Raccoon Gang', file: 'raccoongang.html' },
            { day: 5, name: 'RE-IND Homeland', file: 'day5.html' },
            { day: 6, name: 'Celestial Drift', file: 'day6.html' },
            { day: 7, name: 'Raccoons of Chongqing', file: 'day7.html' },
            { day: 8, name: 'SolarFlare', file: 'solarflare-about.html' },
            { day: 9, name: 'NERV Terminal', file: 'day9.html' },
            { day: 10, name: 'NERV System Monitor', file: 'day10.html' }
            // More pages will be added here as the collection grows
        ];

        // Find current page index
        const currentPageFile = window.location.pathname.split('/').pop();
        const currentIndex = daysOfPages.findIndex(page => page.file === currentPageFile);

        // Update page indicator
        if (currentIndex !== -1) {
            document.getElementById('pageIndicator').textContent =
                `Day ${daysOfPages[currentIndex].day}/365`;
        }

        // Navigation function
        function navigate(direction) {
            if (currentIndex === -1) return;

            let newIndex;
            if (direction === 'prev') {
                newIndex = currentIndex - 1;
            } else {
                newIndex = currentIndex + 1;
            }

            if (newIndex >= 0 && newIndex < daysOfPages.length) {
                window.location.href = `/365/${daysOfPages[newIndex].file}`;
            }
        }

        // Update button states
        if (currentIndex !== -1) {
            if (currentIndex === 0) {
                document.getElementById('prevBtn').disabled = true;
            }
            if (currentIndex === daysOfPages.length - 1) {
                document.getElementById('nextBtn').disabled = true;
            }
        }

        // Subtle parallax effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;

            document.querySelector('.background').style.transform =
                `translate(${moveX}px, ${moveY}px) scale(1.1)`;
        });

        // Smooth scroll reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        });

        document.querySelectorAll('.glass-card').forEach((el) => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'all 1s ease-out';
            observer.observe(el);
        });
    </script>
</body>
</html>
